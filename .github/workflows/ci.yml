name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLAD codegen dependencies
        run: pip install jinja2

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release
